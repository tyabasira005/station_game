<!doctype html>
<html lang="ja" data-mode="mobile">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>駅名タイピング プレイ中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="css/keys.css">
<script src="js/mode.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect width="8" height="8" fill="#0f1b2a"/><rect x="1" y="1" width="6" height="6" fill="#0a4ea3"/><rect x="1" y="3" width="6" height="2" fill="#fff"/><rect x="3" y="2" width="2" height="4" fill="#0a4ea3"/><rect x="3" y="3" width="2" height="2" fill="#fff"/></svg>
      <span class="name">駅名タイピング</span>
    </div>
    <button type="button" class="mode" id="modeBtn">PC版に切り替え</button>
  </header>

  <main class="stage">
    <section class="screen">
      <div class="hud">
        <div class="cell"><span class="lab">スコア</span><span class="val" id="scoreEl">0</span></div>
        <div class="cell"><span class="lab">コンボ</span><span class="val"><span id="comboEl">0</span><span class="mult" id="multEl"></span></span></div>
        <div class="cell"><span class="lab">乗り遅れ</span><span class="lives" id="lives" aria-label="乗り遅れ回数"><i></i><i></i><i></i></span></div>
      </div>
      <div class="board" id="board">
        <div class="brow front" id="rowF">
          <div class="meta"><span class="ty" id="fTy">普通</span><span class="sig" id="sig" data-s="g"><i class="r"></i><i class="y"></i><i class="g"></i></span><span class="tm" id="fTm">0秒発</span></div>
          <div class="dest"><span id="dest"></span><small>行き</small></div>
          <div class="yomi" id="yomi"></div>
          <div class="romaji" id="romaji"></div>
        </div>
        <div class="sub" id="row2"><span class="ty"></span><span class="dst"></span><span class="tm"></span></div>
        <div class="sub" id="row3"><span class="ty"></span><span class="dst"></span><span class="tm"></span></div>
      </div>
      <p class="hint" id="hint">&nbsp;</p>
    </section>
  </main>

  <div class="kb" id="kb" aria-label="画面キーボード"></div>
  <div class="kana" id="kana" aria-label="かなキーパッド"></div>
</div>
<script src="js/data.js"></script>
<script src="js/romaji.js"></script>
<script src="js/kana.js"></script>
<script src="js/common.js"></script>
<script src="js/keys.js"></script>
<script src="js/play.js"></script>
</body>
</html>
