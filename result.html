<!doctype html>
<html lang="ja" data-mode="mobile">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>駅名タイピング 結果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/result.css">
<script src="js/mode.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect width="8" height="8" fill="#0f1b2a"/><rect x="1" y="1" width="6" height="6" fill="#0a4ea3"/><rect x="1" y="3" width="6" height="2" fill="#fff"/><rect x="3" y="2" width="2" height="4" fill="#0a4ea3"/><rect x="3" y="3" width="2" height="2" fill="#fff"/></svg>
      <span class="name">駅名タイピング</span>
    </div>
    <button type="button" class="mode" id="modeBtn">PC版に切り替え</button>
  </header>

  <main class="stage">
    <section class="screen" aria-live="polite">
      <p class="eyebrow" id="rEye">運転終了</p>
      <p class="rank" id="rRank"></p>
      <p class="lead" id="rSub"></p>
      <dl class="stats">
        <div class="stat"><dt>乗車した駅</dt><dd><span id="rWords">0</span><small>駅</small></dd></div>
        <div class="stat"><dt>スコア</dt><dd id="rScore">0</dd></div>
        <div class="stat"><dt>正確さ</dt><dd><span id="rAcc">0</span><small>%</small></dd></div>
        <div class="stat"><dt>最大コンボ</dt><dd id="rCombo">0</dd></div>
      </dl>
      <p class="best" id="rBest"></p>
      <a class="btn" id="rAgain" href="play.html">もう一度</a>
      <a class="btn btn-alt" id="rBack" href="index.html">路線を選びなおす</a>
      <p class="kbd-hint pc-only">Enter キーでもう一度始められます。</p>
    </section>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/result.js"></script>
</body>
</html>
